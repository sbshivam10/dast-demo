name: DAST Scan - Juice Shop via Bridge CLI + Teleport

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: dast-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dast-scan:
    name: Trigger Polaris DAST (CI/CD)
    runs-on: self-hosted

    env:
      BRIDGE_POLARIS_ACCESSTOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Juice Shop is running
        shell: bash
        run: |
          echo "Checking if Juice Shop is reachable on http://localhost:3000 ..."
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Juice Shop is reachable!"
              exit 0
            fi
            echo "⏳ Waiting for Juice Shop... attempt $i/10"
            sleep 3
          done

          echo "❌ Juice Shop is not reachable."
          echo "Start it manually before running the workflow:"
          echo "docker compose up -d"
          exit 1

      - name: Verify Bridge CLI
        shell: bash
        run: |
          bridge-cli --version

      - name: Trigger Polaris DAST scan
        shell: bash
        run: |
          set +e

          bridge-cli --stage polaris \
            polaris.serverUrl="${{ secrets.POLARIS_SERVER_URL }}" \
            polaris.assessment.types="DAST" \
            polaris.application.name="${{ secrets.POLARIS_APP_NAME }}" \
            polaris.project.name="${{ secrets.POLARIS_PROJECT_NAME }}" \
            polaris.waitForScan=false 2>&1 | tee bridge-output.log

          BRIDGE_EXIT_CODE=${PIPESTATUS[0]}

          echo "Bridge CLI exit code: ${BRIDGE_EXIT_CODE}"

          if grep -q "Successfully created test" bridge-output.log; then
            echo "✅ Polaris DAST scan was successfully triggered."
            echo "Bridge CLI returned a non-zero code after async trigger, but the test was created successfully."
            exit 0
          fi

          echo "❌ Polaris DAST scan was not confirmed as created."
          echo "Bridge CLI output did not contain: Successfully created test"
          exit ${BRIDGE_EXIT_CODE}

      - name: Print success
        shell: bash
        run: |
          echo "✅ GitHub Actions pipeline completed successfully."
          echo "👉 Check Polaris UI for DAST scan progress and results."
