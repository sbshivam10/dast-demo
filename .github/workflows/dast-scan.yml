name: DAST Scan - Juice Shop via Bridge CLI + Teleport

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: dast-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dast-scan:
    name: Trigger Polaris DAST (CI/CD)
    runs-on: self-hosted

    env:
      BRIDGE_POLARIS_ACCESSTOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Verify app is running
      - name: Verify Juice Shop is running
        run: |
          echo "Checking if app is reachable..."
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Juice Shop is reachable!"
              exit 0
            fi
            echo "⏳ Waiting for app..."
            sleep 3
          done
          echo "❌ App not reachable. Run: docker compose up -d"
          exit 1

      # 3. Verify Bridge CLI
      - name: Verify Bridge CLI
        run: |
          bridge-cli --version

      # 4. Trigger Polaris DAST scan (KEY STEP)
      - name: Trigger Polaris DAST scan
        run: |
          bridge-cli --stage polaris \
            polaris.serverUrl="${{ secrets.POLARIS_SERVER_URL }}" \
            polaris.assessment.types="DAST" \
            polaris.application.name="${{ secrets.POLARIS_APP_NAME }}" \
            polaris.project.name="${{ secrets.POLARIS_PROJECT_NAME }}" \
            polaris.waitForScan=false

      # 5. Success message
      - name: Print success
        run: |
          echo "✅ DAST scan triggered successfully"
          echo "👉 Check Polaris dashboard"

